# TechLead OS (tos) — per-installation config.
# Copy to ~/.config/tos/config.yaml (or point $TOS_CONFIG at it).
# Never commit it. It holds no secrets: connector auth lives in Claude Code's MCP
# configuration; the one script that could ever need a token is given the NAME of
# an environment variable, never a value.

engine: "0.7"                          # the engine version this config was written for

data:
  root: ~/CHANGE_ME/techlead-os-data   # replace this: raw/, wiki/, Home.md, .obsidian/ live here (created
                                       # by /tos-init). Anywhere your policy allows; it need not sit next to the engine.
  timezone: Australia/Melbourne
  actor: human:CHANGE_ME               # replace this: the human actor in every verified entry

rollout:
  phase: 1                             # 1: documents; 2: Jira + sprint tick; 3: team, Slack, /tos-brief; 4: vision, learning, radar

# `provider` is the kind of connector: it picks the write-tool vocabulary in
# schema/connector-writes.yaml. `mcp_server` is what the server is actually called in
# Claude Code — run `claude mcp list` and copy the name exactly. They are not the same
# thing: one install exposed Atlassian as `claude_ai_Jira` and `plugin_atlassian_atlassian`,
# so entries guarding `atlassian` matched nothing and denied nothing. A connector may name
# several servers. Run `uv run tos-deny` after editing this block.
connectors:
  confluence:
    provider: mcp:atlassian
    mcp_server: [atlassian, claude_ai_Atlassian, claude_ai_Confluence, plugin_atlassian_atlassian]
    scope: { spaces: ["ENG", "PDLC"] }
  web:
    provider: mcp:fetch
  md:
    provider: filesystem
    scope: { repos: [] }               # e.g. ["~/code/asset-search"] — local repos read straight off disk
  gdocs:                               # enabled from phase 1 once you add folders
    provider: mcp:google-drive
    mcp_server: [gdrive, claude_ai_Google_Drive]
    scope: { folders: [] }
  jira:                                # phase 2
    provider: mcp:atlassian
    mcp_server: [atlassian, claude_ai_Atlassian, claude_ai_Jira, plugin_atlassian_atlassian]
    scope: { projects: [], boards: [] }
  slack:                               # phase 3
    provider: mcp:slack
    mcp_server: [slack, claude_ai_Slack]
    scope: { channels: [], dms: false }
  trello:                              # phase 4, personal board (D12)
    provider: mcp:trello
    mcp_server: [trello, claude_ai_Trello]
    scope: { boards: [] }

feeds:                                 # the only pulls that run without a pointer from you (D11); none in phase 1
  # sprint-report:
  #   connector: jira
  #   pointer: "board 42 sprint report"
  #   when: sprint_boundary
  #   actor: process:pull-sprint-report
  # team-channel-digest:
  #   connector: slack
  #   pointer: "#team-search, last 7 days"
  #   when: weekly
  #   actor: process:pull-team-channel-digest

review:
  weekly_day: monday
  sprint_length_days: 14
  verify_queue: 5
  draft_age_days: 14                   # lint flags drafts older than this
  expiring_days: 7                     # lint flags pages expiring within this window
  weekly_log_grace_days: 16            # lint flags an active project whose newest weekly entry is older
                                       # than this (one quiet Monday is fine; two suggest pausing it)

metrics:
  jira_token_env: JIRA_TOKEN           # fallback executor only; a variable NAME, never a value

# TechLead OS (tos) — per-installation config.
# Copy to ~/.config/tos/config.yaml (or point $TOS_CONFIG at it).
# Never commit it. It holds no secrets: connector auth lives in Claude Code's MCP
# configuration; the one script that could ever need a token is given the NAME of
# an environment variable, never a value.

engine: "0.11"                         # the engine version this config was written for

data:
  root: ~/CHANGE_ME/techlead-os-data   # replace this: raw/, wiki/, Home.md, .obsidian/ live here (created
                                       # by /tos-init). Anywhere your policy allows; it need not sit next to the engine.
  timezone: Australia/Melbourne
  actor: human:CHANGE_ME               # replace this: the human actor in every verified entry

rollout:
  phase: 1                             # commands and page types, not reads: 1: delivery, design, systems;
                                       # 2: sprint tick; 3: team, /tos-brief; 4: vision, learning, radar, trello

connectors:                            # no scope but md's and trello's: the rest read whatever your own account
                                       # can; the write tools are denied in .claude/settings.json
  confluence:
    provider: mcp:atlassian            # the MCP server name as configured in Claude Code
  gdrive:                              # Docs, Sheets, Slides, PDFs, Office files
    provider: mcp:claude_ai_Google_Drive   # `claude.ai Google Drive` in its tool-id form, the one the deny list guards
  jira:
    provider: mcp:atlassian
  slack:                               # never a DM or group DM
    provider: mcp:slack
  web:
    provider: mcp:fetch
  md:
    provider: filesystem
    scope: { repos: [] }               # e.g. ["~/code/asset-search"] — local repos read straight off disk
  trello:                              # phase 4, personal board (D12)
    provider: mcp:trello
    scope: { boards: [] }

feeds:                                 # the only pulls that run without a pointer from you (D11); none in phase 1
  # sprint-report:
  #   connector: jira
  #   pointer: "board 42 sprint report"
  #   when: sprint_boundary
  #   actor: process:pull-sprint-report
  # team-channel-digest:
  #   connector: slack
  #   pointer: "#team-search, last 7 days"
  #   when: weekly
  #   actor: process:pull-team-channel-digest

review:
  weekly_day: monday
  sprint_length_days: 14
  verify_queue: 5
  draft_age_days: 14                   # lint flags drafts older than this
  expiring_days: 7                     # lint flags pages expiring within this window
  weekly_log_grace_days: 16            # lint flags an active project whose newest weekly entry is older
                                       # than this (one quiet Monday is fine; two suggest pausing it)

metrics:
  jira_token_env: JIRA_TOKEN           # fallback executor only; a variable NAME, never a value

[project]
name = "techlead-os"
version = "0.7.4"
description = "TechLead OS (tos) — the engine half of a personal knowledge OS: OKF v0.2 bundle tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
tos-config = "tos.common:cli"
tos-init = "tos.init:cli"
tos-lint = "tos.lint:cli"
tos-deny = "tos.deny:cli"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tos"]

[tool.hatch.build.targets.sdist]
include = [".claude", "src", "schema", "tests", "docs", "config.example.yaml", "CLAUDE.md", "CHANGELOG.md", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

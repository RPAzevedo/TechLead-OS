# Write-capable tool names, per connector kind (the part after `mcp:` in a
# connector's `provider`). `tos-deny` crosses these with the server names in
# your config to work out which `permissions.deny` entries guardrail 11 needs.
#
# A kind lists every naming convention its servers are known to use, because the
# same connector is exposed under different vocabularies by different servers —
# Atlassian's own remote MCP says `createJiraIssue`, the community one says
# `jira_create_issue`. Emitting both for a server costs nothing: an entry that
# matches no tool is inert. A missing one is a hole.
#
# Add to this file when you meet a server that names a write tool something else.

